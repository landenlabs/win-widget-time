name: Build and Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish portable single-file (self-contained, compressed)
      run: >
        dotnet publish WinWidgetTime.csproj -c Release -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:EnableCompressionInSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:IncludeAllContentForSelfExtract=true
        -o publish

    - name: Zip artifacts
      run: Compress-Archive -Path publish\* -DestinationPath WinWidgetTime.zip

    # ---- MSIX installers ---------------------------------------------------
    # Signing certificate: if repo secrets MSIX_CERT_BASE64 (base64 .pfx) and
    # MSIX_CERT_PASSWORD are set, that certificate is used and its subject
    # becomes the package Publisher. Otherwise a self-signed certificate is
    # generated and its public .cer is attached to the release so users can
    # trust it before installing.
    - name: Prepare MSIX signing certificate
      id: cert
      shell: pwsh
      env:
        MSIX_CERT_BASE64: ${{ secrets.MSIX_CERT_BASE64 }}
        MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
      run: |
        $pfx = Join-Path $env:RUNNER_TEMP 'msix-signing.pfx'
        New-Item -ItemType Directory -Force dist | Out-Null
        if ($env:MSIX_CERT_BASE64) {
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERT_BASE64))
          $pass = $env:MSIX_CERT_PASSWORD
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $pass)
          $publisher = $cert.Subject
          $timestamp = 'http://timestamp.digicert.com'
        } else {
          $publisher = 'CN=LanDen Labs'
          $pass = [guid]::NewGuid().ToString('N')
          echo "::add-mask::$pass"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -FriendlyName 'WinWidgetTime MSIX signing' `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-PfxCertificate -Cert $cert -FilePath $pfx `
            -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath dist\WinWidgetTime.cer | Out-Null
          $timestamp = ''
        }
        "pfx=$pfx"             >> $env:GITHUB_OUTPUT
        "password=$pass"        >> $env:GITHUB_OUTPUT
        "publisher=$publisher" >> $env:GITHUB_OUTPUT
        "timestamp=$timestamp" >> $env:GITHUB_OUTPUT

    - name: Build MSIX (x64 + arm64)
      shell: pwsh
      run: |
        foreach ($arch in 'x64', 'arm64') {
          ./.github/scripts/build-msix.ps1 -Arch $arch -Version '${{ github.ref_name }}' `
            -PfxPath '${{ steps.cert.outputs.pfx }}' -PfxPassword '${{ steps.cert.outputs.password }}' `
            -Publisher '${{ steps.cert.outputs.publisher }}' -TimestampUrl '${{ steps.cert.outputs.timestamp }}' `
            -OutDir dist
        }

    - name: Remove signing certificate
      if: always()
      shell: pwsh
      run: Remove-Item (Join-Path $env:RUNNER_TEMP 'msix-signing.pfx') -ErrorAction SilentlyContinue

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: WinWidgetTime
        path: |
          WinWidgetTime.zip
          dist/*
        retention-days: 30

    - name: Create GitHub Release and attach packages
      uses: softprops/action-gh-release@v2
      with:
        files: |
          WinWidgetTime.zip
          dist/*.msix
          dist/*.cer
          install-msix.ps1
          uninstall-msix.ps1
